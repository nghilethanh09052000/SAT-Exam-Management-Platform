[tool.poetry]
name = "sat-pipeline"
version = "0.1.0"
description = "Temporal-based ETL pipeline for SAT Exam Management Platform"
authors = []
readme = "README.md"
packages = [{ include = "." }]

[tool.poetry.dependencies]
python                  = "^3.11"
temporalio              = "^1.7"
playwright              = "^1.44"
beautifulsoup4          = "^4.12"
dbt-core                = "^1.8"
dbt-clickhouse          = "^1.8"
dbt-bigquery            = "^1.8"
clickhouse-connect      = "^0.7"
sqlalchemy              = "^2.0"
asyncpg                 = "^0.29"
pydantic                = "^2.7"
pydantic-settings       = "^2.2"
structlog               = "^24.1"
google-cloud-storage    = "^2.16"
google-cloud-bigquery   = "^3.20"
python-docx             = "^1.1"
pylatexenc              = "^2.10"
scikit-learn            = "^1.4"
python-dotenv           = "^1.0"
fastapi                 = "^0.111"
uvicorn                 = { version = "^0.29", extras = ["standard"] }

[tool.poetry.group.dev.dependencies]
pytest             = "^8.2"
pytest-asyncio     = "^0.23"
ruff               = "^0.4"
mypy               = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
