version: 2

sources:
  - name: sat_raw
    database: "{{ env_var('BQ_PROJECT_ID') }}"
    schema: sat_raw
    tables:
      - name: sat_questions_raw
        description: Raw scraped SAT questions appended from GCS loads
        columns:
          - name: question_id
            description: Stable SHA-256 hash (source + url + text)
          - name: source
            description: "bluebooky | satgpt"
          - name: source_url
          - name: section
            description: "Math | Reading & Writing"
          - name: domain
          - name: difficulty
            description: "Easy | Medium | Hard (nullable)"
          - name: question_text
          - name: choices
            description: JSON object of answer choices
          - name: correct_answer
          - name: explanation
            description: Nullable
          - name: scraped_at
            description: UTC timestamp
