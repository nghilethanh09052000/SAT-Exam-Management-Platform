sat_pipeline:
  outputs:
    # Flow 1 — BigQuery (primary target)
    bigquery:
      type: bigquery
      method: oauth                   # uses GOOGLE_APPLICATION_CREDENTIALS
      project: "{{ env_var('BQ_PROJECT_ID') }}"
      dataset: sat_clean
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      timeout_seconds: 300

    # Flow 2 — ClickHouse (secondary target for sync flow)
    clickhouse:
      type: clickhouse
      schema: sat_clean
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300

  target: "{{ env_var('DBT_TARGET', 'bigquery') }}"
