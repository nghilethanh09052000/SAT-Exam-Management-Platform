---
# VM Deployment — SAT Platform
#
# STATUS: DISABLED
# This workflow is ready but not active. Enable it by:
#   1. Uncommenting the "on:" trigger block below
#   2. Adding the required secrets to GitHub (VM_HOST, VM_USER, VM_SSH_KEY, VM_APP_DIR, VM_APP_URL)
#   3. Removing the "if: false" guard from the deploy job
#
# Use this when migrating away from Vercel to a self-hosted VM.

name: Deploy to VM

"on":
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy App to VM
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Deploy to VM via SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}
                  script_stop: true
                  envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY
                  script: |
                      set -euo pipefail
                      cd ${{ secrets.VM_APP_DIR }}

                      echo "--- Pulling latest code ---"
                      git pull origin main

                      echo "--- Writing .env from GitHub Secrets ---"
                      cat > .env << 'ENVEOF'
                      NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                      NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
                      SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                      ENVEOF
                      chmod 600 .env
                      echo ".env written."

                      echo "--- Installing dependencies ---"
                      pnpm install --frozen-lockfile

                      echo "--- Building app ---"
                      pnpm run build

                      echo "--- Restarting app process ---"
                      pm2 restart sat-platform --update-env || pm2 start pnpm --name sat-platform -- start

                      echo "--- Deploy complete ---"

            - name: Health check
              run: |
                  echo "Waiting for app to come up..."
                  sleep 10
                  for i in {1..5}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.VM_APP_URL }}" || echo "000")
                    echo "Health check attempt $i: HTTP $STATUS"
                    if [ "$STATUS" = "200" ]; then
                      echo "Health check passed."
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "Health check FAILED — app did not return HTTP 200 after 5 attempts."
                  exit 1

            - name: Notify Telegram — deploy success
              if: success()
              uses: ./.github/actions/telegram-notify
              with:
                  bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
                  message: |
                      ✅ *SAT Platform — VM deployed*
                      App is live at ${{ secrets.VM_APP_URL }}
                      Commit: `${{ github.sha }}`
                      By: ${{ github.actor }}

            - name: Notify Telegram — deploy failure
              if: failure()
              uses: ./.github/actions/telegram-notify
              with:
                  bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
                  message: |
                      ❌ *SAT Platform — VM deploy FAILED*
                      Commit: `${{ github.sha }}`
                      By: ${{ github.actor }}
                      [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
