---
# Supabase Deploy — SAT Platform
#
# NOTE: This workflow is DISABLED in favour of the migration job inside ci.yml
# which already runs migrations on every push to main with full quality gates.
# Enable this only if you need a standalone migration-only pipeline.
#
# To re-enable: remove the "if: false" guard from the deploy job.

name: Supabase Deploy

"on":
    workflow_dispatch:
        inputs:
            skip_seed:
                description: Skip seed data (run migrations only)
                required: false
                default: "false"
                type: boolean

jobs:
    deploy:
        name: Migrate & Seed
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: latest

            # ── Migrations ────────────────────────────────────────────────────
            - name: Link to production project
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
              run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

            - name: Run migrations
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
                  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
              run: supabase db push --password "$SUPABASE_DB_PASSWORD"

            # ── Seed data ─────────────────────────────────────────────────────
            - name: Run seed (tags)
              if: ${{ github.event.inputs.skip_seed != 'true' }}
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              run: supabase db execute --file supabase/seed.sql

            - name: Run dev seed (demo users)
              if: ${{ github.event.inputs.skip_seed != 'true' }}
              env:
                  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
              run: supabase db execute --file supabase/dev-seed.sql
