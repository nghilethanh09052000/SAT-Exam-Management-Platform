name: Supabase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_seed:
        description: "Skip seed data (run migrations only)"
        required: false
        default: "false"
        type: boolean

jobs:
  deploy:
    name: Migrate & Seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Supabase CLI
        run: pnpm add -g supabase

      # ── Migrations ──────────────────────────────────────────────────────────
      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # ── Seed data ───────────────────────────────────────────────────────────
      - name: Run seed (tags)
        if: ${{ github.event.inputs.skip_seed != 'true' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "host=${{ secrets.SUPABASE_DB_HOST }} \
             port=5432 \
             dbname=postgres \
             user=postgres \
             sslmode=require" \
            -f supabase/seed.sql

      - name: Run dev seed (demo data)
        if: ${{ github.event.inputs.skip_seed != 'true' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "host=${{ secrets.SUPABASE_DB_HOST }} \
             port=5432 \
             dbname=postgres \
             user=postgres \
             sslmode=require" \
            -f supabase/dev-seed.sql
