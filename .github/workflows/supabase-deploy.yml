name: Supabase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_seed:
        description: "Skip seed data (run migrations only)"
        required: false
        default: "false"
        type: boolean

jobs:
  deploy:
    name: Migrate & Seed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Migrations ──────────────────────────────────────────────────────────
      - name: Run migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED_PASS=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          supabase db push \
            --db-url "postgresql://postgres.fioculhfqqgvigoqayfo:${ENCODED_PASS}@aws-0-ap-south-1.pooler.supabase.com:5432/postgres"

      # ── Seed data ───────────────────────────────────────────────────────────
      - name: Run seed (tags)
        if: ${{ github.event.inputs.skip_seed != 'true' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "host=aws-0-ap-south-1.pooler.supabase.com \
             port=5432 \
             dbname=postgres \
             user=postgres.fioculhfqqgvigoqayfo \
             sslmode=require" \
            -f supabase/seed.sql

      - name: Run dev seed (demo data)
        if: ${{ github.event.inputs.skip_seed != 'true' }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            "host=aws-0-ap-south-1.pooler.supabase.com \
             port=5432 \
             dbname=postgres \
             user=postgres.fioculhfqqgvigoqayfo \
             sslmode=require" \
            -f supabase/dev-seed.sql
