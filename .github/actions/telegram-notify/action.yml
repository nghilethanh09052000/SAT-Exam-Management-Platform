name: Telegram Notify
description: Send a message to a Telegram chat via bot

inputs:
    message:
        description: Message text (Markdown supported)
        required: true
    bot-token:
        description: Telegram bot token
        required: true
    chat-id:
        description: Telegram chat/group/channel ID
        required: true

runs:
    using: composite
    steps:
        - name: Send Telegram message
          shell: bash
          run: |
              curl -s -X POST "https://api.telegram.org/bot${{ inputs.bot-token }}/sendMessage" \
                -d chat_id="${{ inputs.chat-id }}" \
                -d parse_mode="Markdown" \
                -d disable_web_page_preview="true" \
                -d text="${{ inputs.message }}" \
                | jq -e '.ok == true' > /dev/null \
                || echo "Warning: Telegram notification failed (non-blocking)"
